# High-level mount time benchmarks


# these are common and can be overridden suite-wide
#
# note for bench_*_many, file size defaults to CHUNK, and SIZE = sum of
# all files
#
defines.SIZE = '1024*1024' # 1 MiB
defines.CHUNK = 64
defines.SEED = 42

# simulate this number of mounts or interuppted log-rotations
defines.SIM_MOUNTS = 10000
defines.SIM_ROTATES = 10 # ignored if not POWERLOSS
# simulated time, in nanoseconds, to run the test
defines.SIM_TIME = 0 # '60ULL*60ULL*1000ULL*1000ULL*1000ULL' # 1 hour
# simulation size in bytes
defines.SIM_SIZE = 0

# set this to true to skip bench warmup
defines.SKIP_WARMUP = false

# optionally create a bunch of static files
defines.STATIC_COUNT = 0
defines.STATIC_SIZE = 512 # 64 # inlined (in theory, check mdirs/data)

# also bench read-only mount?
defines.ROMOUNT = true

# run with simulated powerloss? defaults to a nice shutdown
# 0 => nice shutdown
# 1 => oh no, unexpected shutdown
# 2 => oh nooo, unexpected shutdown during only progs
defines.POWERLOSS = false

# emulate failed progs by adding noise?
defines.POWERLOSS_NOISE = false

# for spiffs, check the filesystem after a powerloss
#
# note this may take a very long time, but the metadata itself is pl
# safe, so it _should_ be ok to call this on error
#
# relevant spiffs docs:
# https://github.com/pellepl/spiffs/wiki/FAQ#
#     powerlosses-contd-when-should-i-run-spiffs_check
#
# available check modes:
# 0 => no pl check
# 1 => check after mount
# 2 => check after error
# 3 => at least force a log-rotate, this avoids corrupt logs getting
#      stuck without losing data
defines.POWERLOSS_CHECK = 2
# 0 => try to keep writing to log after an error
# 1 => immediately rotate log after an error
# 2 => just remove log after an error
# 3 => rename log to *.trash, note this risks space issues
defines.POWERLOSS_CHECKROTATE = 1

# how long before powerloss/shutdown, we choose a uniform number of
# nanoseconds between these
defines.POWER_MINTIME = 0
defines.POWER_MAXTIME = '10ULL*1000ULL*1000ULL*1000ULL' # 10 seconds
# alternatively, how long as defined by progs
defines.POWER_MINPROGS = 0
defines.POWER_MAXPROGS = 0
# 0 => don't wait for mount+write
# 1 => wait for mount+write
# 2 => only wait for mount+write if stuck
defines.POWER_WAITFORMOUNT = 2
# abort if we make not progress this many times, you probably need to
# increase POWER_MAXTIME or POWER_MAXPROGS
defines.POWER_STUCKTHRESH = 10
defines.POWER_STUCKASSERT = true

if = [
    # spiffs is limited to 32-bit disks
    'BENCH_IFDEF_SPIFFS(DISK_SIZE < 0x100000000ULL, true)',
    # SPIFFS_check just takes way too long on big disks
    'BENCH_IFDEF_SPIFFS(!POWERLOSS || DISK_SIZE <= 128*1024*1024, true)',
]

hooks.init = 'bench_mount_init'
hooks.read = 'bench_mount_bd_read'
hooks.prog = 'bench_mount_bd_prog'
hooks.erase = 'bench_mount_bd_erase'
code = '''
    // include common bench helpers
    #include "benches/bench_helpers.h"

    // use longjmp to emulate powerlosses
    #include <setjmp.h>
    jmp_buf bench_mount_jmp;

    // progs since last mount
    int64_t bench_mount_progs;
    uint32_t bench_mount_prng;
    // run timing for simulated powerloss
    bench_sns_t bench_mount_start_time;
    bench_sns_t bench_mount_stop_time;
    int64_t bench_mount_start_progs;
    int64_t bench_mount_stop_progs;

    // reset for next mount
    void bench_mount_reset(void) {
        bench_mount_progs = 0;
        bench_mount_start_time = -1;
        bench_mount_stop_time = -1;
        bench_mount_start_progs = -1;
        bench_mount_stop_progs = -1;
    }

    // init bench state
    void bench_mount_init(void) {
        bench_mount_prng = 42;
        bench_mount_reset();
    }

    // hook read
    int bench_mount_bd_read(const struct lfs3_cfg *cfg, lfs3_block_t block,
            lfs3_off_t off, void *buffer, lfs3_size_t size) {
        // time for powerloss?
        if (POWERLOSS == 1
                && ((bench_mount_stop_time != -1
                        && BENCH_SIMTIME() >= bench_mount_stop_time)
                    || (bench_mount_stop_progs != -1
                        && bench_mount_progs > bench_mount_stop_progs))) {
            // simulate powerloss
            longjmp(bench_mount_jmp, 1);
        }

        return BENCH_BD_READNOHOOKS(cfg, block, off, buffer, size);
    }

    // hook prog
    //
    // this one has a few more features because it's the most
    // interesting under powerloss
    int bench_mount_bd_prog(const struct lfs3_cfg *cfg, lfs3_block_t block,
            lfs3_off_t off, const void *buffer, lfs3_size_t size) {
        // time for powerloss?
        if (POWERLOSS
                && ((bench_mount_stop_time != -1
                        && BENCH_SIMTIME() >= bench_mount_stop_time)
                    || (bench_mount_stop_progs != -1
                        && bench_mount_progs > bench_mount_stop_progs))) {
            // write noise
            if (POWERLOSS_NOISE) {
                uint8_t noise[size];
                for (lfs3_size_t i = 0; i < size; i++) {
                    noise[i] = BENCH_PRNG(&bench_mount_prng);
                }
                int err = BENCH_BD_PROGNOHOOKS(cfg, block, off, noise, size);
                assert(!err);
            }

            // simulate powerloss
            longjmp(bench_mount_jmp, 1);
        }

        int err = BENCH_BD_PROGNOHOOKS(cfg, block, off, buffer, size);
        // increment progs
        bench_mount_progs += 1;
        return err;
    }

    // hook erase
    int bench_mount_bd_erase(const struct lfs3_cfg *cfg, lfs3_block_t block) {
        // time for powerloss?
        if (POWERLOSS == 1
                && ((bench_mount_stop_time != -1
                        && BENCH_SIMTIME() >= bench_mount_stop_time)
                    || (bench_mount_stop_progs != -1
                        && bench_mount_progs > bench_mount_stop_progs))) {
            // simulate powerloss
            longjmp(bench_mount_jmp, 1);
        }

        return BENCH_BD_ERASENOHOOKS(cfg, block);
    }
'''


# logging write throughput
#
# two big differences from seq:
# 1. fruncate/rotations instead of rewind+truncate
# 2. sync called on every write
[cases.bench_mount_logging]
defines.FRUNCATE = false
code = '''
    #if defined(LFS3)
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_MKCONSISTENT, CFG) => 0;
    #elif defined(LFS2)
    lfs2_t lfs2;
    lfs2_format(&lfs2, CFG_LFS2) => 0;
    lfs2_mount(&lfs2, CFG_LFS2) => 0;
    lfs2_fs_mkconsistent(&lfs2) => 0;
    #elif defined(SPIFFS)
    spiffs spiffs;
    spiffs.user_data = CFG;
    uint8_t *work_buffer = malloc(2*SPAGE_SIZE);
    uint8_t *fd_buffer = malloc(FD_SIZE);
    uint8_t *scache_buffer = malloc(SCACHE_SIZE);
    // spiffs format without magic just needs a disk erase
    SPIFFS_mount(&spiffs, (spiffs_config*)CFG_SPIFFS, work_buffer,
            fd_buffer, FD_SIZE,
            scache_buffer, SCACHE_SIZE,
            NULL) => 0;
    #elif defined(YAFFS2)
    // note this implicitly zeros yaffs_dev
    struct yaffs_dev yaffs2 = {
        .driver_context = CFG,
        .param = CFG_YAFFS2->param,
        .drv = CFG_YAFFS2->drv,
    };
    yaffs_add_device(&yaffs2);
    yaffs_format("/", false, false, false) => 0;
    yaffs_mount("/") => 0;
    #endif
    if (!SKIP_WARMUP) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        #if defined(LFS3)
        int err = bench_helpers_warmup(CFG, &lfs3);
        #elif defined(LFS2)
        int err = bench_helpers_warmup(CFG, &lfs2);
        #elif defined(SPIFFS)
        int err = bench_helpers_warmup(CFG, &spiffs);
        #elif defined(YAFFS2)
        int err = bench_helpers_warmup(CFG, &yaffs2);
        #endif
        if (err) {
            LFS3_ERROR("Bench warmup failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    if (STATIC_COUNT) {
        BENCH_STACK_PAUSE();
        BENCH_HEAP_PAUSE();
        #if defined(LFS3)
        int err = bench_helpers_populate(CFG, &lfs3,
                STATIC_COUNT, STATIC_SIZE);
        #elif defined(LFS2)
        int err = bench_helpers_populate(CFG, &lfs2,
                STATIC_COUNT, STATIC_SIZE);
        #elif defined(SPIFFS)
        int err = bench_helpers_populate(CFG, &spiffs,
                STATIC_COUNT, STATIC_SIZE);
        #elif defined(YAFFS2)
        int err = bench_helpers_populate(CFG, &yaffs2,
                STATIC_COUNT, STATIC_SIZE);
        #endif
        if (err) {
            LFS3_ERROR("Bench populate failed: %d", err);
            assert(!err);
            return;
        }
        BENCH_HEAP_RESUME();
        BENCH_STACK_RESUME();
    }
    uint32_t prng = SEED;

    // create the log file before our main loop, this avoids create cost
    // getting dragged into our mount + open path
    //
    // yes we pay for creates during logrotation later, but this is only
    // included in write cost, not mount + open cost
    //
    // this hits yaffs2 especially hard because create forces the
    // current checkpoint to be erased, resulting in a one-time spike
    // when mount + open creates the initial file
    #if defined(LFS3)
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "bench_log",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL | LFS3_O_APPEND) => 0;
    lfs3_file_close(&lfs3, &file) => 0;
    #elif defined(LFS2)
    lfs2_file_t file;
    lfs2_file_open(&lfs2, &file, "bench_log",
            LFS2_O_WRONLY | LFS2_O_CREAT | LFS3_O_EXCL | LFS2_O_APPEND) => 0;
    lfs2_file_close(&lfs2, &file) => 0;
    #elif defined(SPIFFS)
    spiffs_file fd = SPIFFS_open(&spiffs, "bench_log",
            SPIFFS_WRONLY | SPIFFS_CREAT | SPIFFS_EXCL | SPIFFS_APPEND, 0777);
    assert(fd >= 0);
    SPIFFS_close(&spiffs, fd) => 0;
    #elif defined(YAFFS2)
    int fd = yaffs_open("bench_log",
            O_WRONLY | O_CREAT | O_EXCL | O_APPEND, 0777);
    assert(fd >= 0);
    yaffs_close(fd) => 0;
    #endif

    // start unmounted
    #if defined(LFS3)
    lfs3_unmount(&lfs3) => 0;
    #elif defined(LFS2)
    lfs2_unmount(&lfs2) => 0;
    #elif defined(SPIFFS)
    SPIFFS_unmount(&spiffs);
    #elif defined(YAFFS2)
    yaffs_unmount("/") => 0;
    yaffs_remove_device(&yaffs2);
    #endif

    // reset our timer
    BENCH_SIMRESET();

    // ok, one of these needs to be non-zero
    LFS3_ASSERT(SIM_MOUNTS > 0
            || (SIM_ROTATES > 0 && !POWERLOSS)
            || SIM_TIME > 0
            || SIM_SIZE > 0);
    volatile uint64_t mounts = 0;
    volatile uint64_t written = 0;
    volatile uint64_t grms = 0;
    volatile uint64_t rotates = 0;
    volatile bool in_rotation = false;
    volatile uint64_t stuck = 0;
    volatile uint64_t stuck_before = -1;
    volatile uint64_t stuck_after = 0;
    //// this is where we end up after powerloss ////
    setjmp(bench_mount_jmp);
    ////                                         ////
    BENCH_ABORT("romount");
    BENCH_ABORT("mountwrite");
    BENCH_ABORT("mount");
    BENCH_ABORT("mkconsistent");
    BENCH_ABORT("open");
    BENCH_ABORT("write_");
    BENCH_ABORT("write");
    BENCH_ABORT("sync_");
    BENCH_ABORT("sync");
    BENCH_ABORT("close");
    BENCH_ABORT("unmount");
    BENCH_ABORT("closeunmount");
    // did we interrupt a log-rotation?
    if (in_rotation) {
        rotates += 1;
        in_rotation = false;
    }
    // are we stuck?
    stuck_after = written;
    if (stuck_after != stuck_before) {
        stuck = 0;
        stuck_before = written;
    } else {
        stuck += 1;
        LFS3_WARN("stuck? written=%"PRIu64", stuck=%"PRIu64", "
                    "t=%"PRId64", p=%"PRId64,
                written, stuck,
                (bench_mount_stop_time != -1)
                    ? BENCH_SIMTIME()-bench_mount_start_time
                    : -1,
                (bench_mount_stop_progs != -1)
                    ? bench_mount_progs-bench_mount_start_progs
                    : -1);
        if (POWER_STUCKTHRESH && stuck >= (uint64_t)POWER_STUCKTHRESH) {
            // abort?
            if (POWER_WAITFORMOUNT != 2) {
                LFS3_ERROR("stuck. stuck=%"PRIu64" >= %"PRIu64", aborting...",
                        stuck, POWER_STUCKTHRESH);
                if (POWER_STUCKASSERT) {
                    assert(stuck < POWER_STUCKTHRESH);
                }
                return;
            // wait?
            } else {
                LFS3_WARN("stuck. stuck=%"PRIu64" >= %"PRIu64", waiting...",
                        stuck, POWER_STUCKTHRESH);
            }
        }
    }
    while ((!SIM_MOUNTS || mounts < (uint64_t)SIM_MOUNTS)
            && (!SIM_ROTATES || rotates < (uint64_t)SIM_ROTATES)
            && (!SIM_SIZE || written < (uint64_t)SIM_SIZE)
            && (!SIM_TIME || BENCH_SIMTIME() < SIM_TIME)) {
        // reset progs
        bench_mount_reset();
        // how long to run this loop?
        if (POWER_WAITFORMOUNT == 0
                || (POWER_WAITFORMOUNT == 2
                    && stuck < (uint64_t)POWER_STUCKTHRESH)) {
            if (POWER_MINTIME || POWER_MAXTIME) {
                bench_mount_start_time = BENCH_SIMTIME();
                bench_mount_stop_time = bench_mount_start_time
                        + POWER_MINTIME
                        + ((0x100010001ULL * BENCH_PRNG(&prng))
                            % (POWER_MAXTIME+1 - POWER_MINTIME));
            }
            if (POWER_MINPROGS || POWER_MAXPROGS) {
                bench_mount_start_progs = 0;
                bench_mount_stop_progs = bench_mount_start_progs
                        + POWER_MINPROGS
                        + (BENCH_PRNG(&prng)
                            % (POWER_MAXPROGS+1 - POWER_MINPROGS));
            }
        }

        // increment mounts
        mounts += 1;

        // measure read-only mount time?
        //
        // optional as there is a risk this messes with the normal
        // somehow (in _theory_ it doesn't...)
        if (ROMOUNT) {
            BENCH_START("romount");
            #if defined(LFS3)
            lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
            #elif defined(LFS2)
            lfs2_mount(&lfs2, CFG_LFS2) => 0;
            #elif defined(SPIFFS)
            // note this is only read-only because we set
            // SPIFFS_USE_MAGIC=0, otherwise spiffs will try to erase
            // any corrupted blocks
            SPIFFS_mount(&spiffs, (spiffs_config*)CFG_SPIFFS, work_buffer,
                    fd_buffer, FD_SIZE,
                    scache_buffer, SCACHE_SIZE,
                    NULL) => 0;
            #elif defined(YAFFS2)
            // yaffs2 uses some global state we need to reset
            extern struct list_head yaffsfs_deviceList;
            INIT_LIST_HEAD(&yaffsfs_deviceList);
            extern int yaffsfs_handlesInitialised;
            yaffsfs_handlesInitialised = false;
            // yes, yaffs2 needs this to be zeroed
            yaffs2 = (struct yaffs_dev){
                .driver_context = CFG,
                .param = CFG_YAFFS2->param,
                .drv = CFG_YAFFS2->drv,
            };
            yaffs_add_device(&yaffs2);
            yaffs_mount2("/", true) => 0;
            //                  ^- read-only
            #endif
            BENCH_STOP("romount", mounts);

            BENCH_START("rounmount");
            #if defined(LFS3)
            lfs3_unmount(&lfs3) => 0;
            #elif defined(LFS2)
            lfs2_unmount(&lfs2) => 0;
            #elif defined(SPIFFS)
            SPIFFS_unmount(&spiffs);
            #elif defined(YAFFS2)
            yaffs_unmount("/") => 0;
            yaffs_remove_device(&yaffs2);
            #endif
            BENCH_STOP("rounmount", mounts);
        }

        // measure mount time
        BENCH_START("mountwrite");
        bool mountwriting = true;
        bool mkconsistented = false;
        #if defined(SPIFFS)
        // spiffs only: needs_check gets set to true if we hit an error
        bool needs_check = false;
    remount_and_check:;
        #endif
        BENCH_START("mount");
        #if defined(LFS3)
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        // keep track of how many grms we've seen
        if (lfs3.grm.queue[0]) {
            grms += 1;
        }
        #elif defined(LFS2)
        lfs2_mount(&lfs2, CFG_LFS2) => 0;
        #elif defined(SPIFFS)
        SPIFFS_mount(&spiffs, (spiffs_config*)CFG_SPIFFS, work_buffer,
                fd_buffer, FD_SIZE,
                scache_buffer, SCACHE_SIZE,
                NULL) => 0;
        LFS3_DEBUG("spiffs: mounted %dx%d blocks, %dx%d pages, %d mounts",
                BLOCK_SIZE, BLOCK_COUNT,
                SPAGE_SIZE, BLOCK_COUNT*(BLOCK_SIZE/SPAGE_SIZE),
                mounts);
        #elif defined(YAFFS2)
        // yaffs2 uses some global state we need to reset
        extern struct list_head yaffsfs_deviceList;
        INIT_LIST_HEAD(&yaffsfs_deviceList);
        extern int yaffsfs_handlesInitialised;
        yaffsfs_handlesInitialised = false;
        // yes, yaffs2 needs this to be zeroed
        yaffs2 = (struct yaffs_dev){
            .driver_context = CFG,
            .param = CFG_YAFFS2->param,
            .drv = CFG_YAFFS2->drv,
        };
        yaffs_add_device(&yaffs2);
        yaffs_mount("/") => 0;
        #endif

        // include mkconsistent cost for fairness
        #if defined(LFS3)
        BENCH_START("mkconsistent");
        lfs3_fs_mkconsistent(&lfs3) => 0;
        mkconsistented = true;
        BENCH_STOP("mkconsistent", mounts);
        #elif defined(LFS2)
        BENCH_START("mkconsistent");
        lfs2_fs_mkconsistent(&lfs2) => 0;
        mkconsistented = true;
        BENCH_STOP("mkconsistent", mounts);
        #elif defined(SPIFFS)
        // check the filesystem for errors after powerloss?
        //
        // note this takes literally forever, see above
        if (POWERLOSS && (POWERLOSS_CHECK == 1 || needs_check)) {
            BENCH_START("mkconsistent");
            LFS3_DEBUG("spiffs: checking...");
            SPIFFS_check(&spiffs) => 0;
            // immediately rotate log after an error?
            if (needs_check && POWERLOSS_CHECKROTATE == 1) {
                int err = SPIFFS_remove(&spiffs, "bench_log.1");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND);
                err = SPIFFS_rename(&spiffs, "bench_log", "bench_log.1");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND);
            // remove log after an error?
            } else if (needs_check && POWERLOSS_CHECKROTATE == 2) {
                int err = SPIFFS_remove(&spiffs, "bench_log");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND);
            // move log to trash after an error?
            } else if (needs_check && POWERLOSS_CHECKROTATE == 3) {
                int err = SPIFFS_remove(&spiffs, "bench_log.trash");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND);
                err = SPIFFS_rename(&spiffs, "bench_log", "bench_log.trash");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND);
            }
            mkconsistented = true;
            BENCH_STOP("mkconsistent", mounts);
        }
        #elif defined(YAFFS2)
        #endif
        BENCH_STOP("mount", mounts);

        // open a file
        //
        // note we don't create here, see above
        BENCH_START("open");
        #if defined(LFS3)
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, "bench_log",
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_APPEND) => 0;
        #elif defined(LFS2)
        lfs2_file_t file;
        lfs2_file_open(&lfs2, &file, "bench_log",
                LFS2_O_WRONLY | LFS2_O_CREAT | LFS2_O_APPEND) => 0;
        #elif defined(SPIFFS)
        spiffs_file fd = SPIFFS_open(&spiffs, "bench_log",
                SPIFFS_WRONLY | SPIFFS_CREAT | SPIFFS_APPEND, 0777);
        assert(fd >= 0);
        #elif defined(YAFFS2)
        int fd = yaffs_open("bench_log",
                O_WRONLY | O_CREAT | O_APPEND, 0777);
        assert(fd >= 0);
        #endif
        BENCH_STOP("open", mounts);
        while (((!SIM_MOUNTS || mounts < (uint64_t)SIM_MOUNTS)
                    && (!SIM_ROTATES || rotates < (uint64_t)SIM_ROTATES)
                    && (!SIM_SIZE || written < (uint64_t)SIM_SIZE)
                    && (!SIM_TIME || BENCH_SIMTIME() < SIM_TIME))
                // time to reboot?
                && !(!POWERLOSS
                    && !mountwriting
                    && ((bench_mount_stop_time != -1
                            && BENCH_SIMTIME() >= bench_mount_stop_time)
                        || (bench_mount_stop_progs != -1
                            && bench_mount_progs > bench_mount_stop_progs)))) {
            if (mountwriting) {
                BENCH_START("write_");
            }
            BENCH_START("write");
            // append to log
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (BENCH_PRNG(&prng) % 26);
            }
            #if defined(LFS3)
            lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
            #elif defined(LFS2)
            lfs2_file_write(&lfs2, &file, wbuf, CHUNK) => CHUNK;
            #elif defined(SPIFFS)
            SPIFFS_write(&spiffs, fd, wbuf, CHUNK) => CHUNK;
            #elif defined(YAFFS2)
            yaffs_write(fd, wbuf, CHUNK) => CHUNK;
            #endif

            // sync
            if (mountwriting) {
                BENCH_START("sync_");
            }
            BENCH_START("sync");
            #if defined(LFS3)
            lfs3_file_sync(&lfs3, &file) => 0;
            #elif defined(LFS2)
            lfs2_file_sync(&lfs2, &file) => 0;
            #elif defined(SPIFFS)
            s32_t d = SPIFFS_fflush(&spiffs, fd);
            assert(d >= 0 || POWERLOSS);
            if (d < 0) {
                // uh oh, found an error? try to remount with check
                LFS3_DEBUG("spiffs: fflush error: %d, remounting...", d);
                needs_check = true;
                BENCH_ABORT("write");
                BENCH_ABORT("write_");
                BENCH_ABORT("sync");
                BENCH_ABORT("sync_");
                SPIFFS_close(&spiffs, fd) => 0;
                SPIFFS_unmount(&spiffs);
                goto remount_and_check;
            }
            #elif defined(YAFFS2)
            yaffs_fsync(fd) => 0;
            #endif
            BENCH_STOP("sync", written + CHUNK);
            if (mountwriting) {
                BENCH_STOP("sync_", mounts);
            }

            // for v3, fruncate, for v2, rotate if full
            //
            // unlike litmus benchmarks we just use SIZE here
            in_rotation = true;
            #if defined(LFS3)
            lfs3_soff_t size = lfs3_file_size(&lfs3, &file);
            assert(size >= 0);
            if (FRUNCATE) {
                if (size > SIZE) {
                    lfs3_file_fruncate(&lfs3, &file, SIZE) => 0;
                }
            } else {
                if (size >= SIZE) {
                    lfs3_file_close(&lfs3, &file) => 0;
                    lfs3_rename(&lfs3, "bench_log", "bench_log.1") => 0;
                    lfs3_file_open(&lfs3, &file, "bench_log",
                            LFS3_O_WRONLY
                                | LFS3_O_CREAT
                                | LFS3_O_EXCL
                                | LFS3_O_APPEND) => 0;
                }
            }
            #elif defined(LFS2)
            lfs3_soff_t size = lfs2_file_size(&lfs2, &file);
            assert(size >= 0);
            if (size >= SIZE) {
                lfs2_file_close(&lfs2, &file) => 0;
                lfs2_rename(&lfs2, "bench_log", "bench_log.1") => 0;
                lfs2_file_open(&lfs2, &file, "bench_log",
                        LFS2_O_WRONLY
                            | LFS2_O_CREAT
                            | LFS2_O_EXCL
                            | LFS2_O_APPEND) => 0;
            }
            #elif defined(SPIFFS)
            spiffs_stat stat;
            SPIFFS_fstat(&spiffs, fd, &stat) => 0;
            assert(stat.size >= 0);
            if (stat.size >= SIZE) {
                SPIFFS_close(&spiffs, fd) => 0;
                int err = SPIFFS_remove(&spiffs, "bench_log.1");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND || POWERLOSS);
                if (err && err != SPIFFS_ERR_NOT_FOUND) {
                    // uh oh, found an error? try to remount with check
                    LFS3_DEBUG("spiffs: remove error: %d, remounting...", err);
                    needs_check = true;
                    BENCH_ABORT("write");
                    BENCH_ABORT("write_");
                    SPIFFS_unmount(&spiffs);
                    goto remount_and_check;
                }
                err = SPIFFS_rename(&spiffs, "bench_log", "bench_log.1");
                assert(!err || err == SPIFFS_ERR_NOT_FOUND || POWERLOSS);
                if (err && err != SPIFFS_ERR_NOT_FOUND) {
                    // uh oh, found an error? try to remount with check
                    LFS3_DEBUG("spiffs: rename error: %d, remounting...", err);
                    needs_check = true;
                    BENCH_ABORT("write");
                    BENCH_ABORT("write_");
                    SPIFFS_unmount(&spiffs);
                    goto remount_and_check;
                }
                fd = SPIFFS_open(&spiffs, "bench_log",
                        SPIFFS_WRONLY
                            | SPIFFS_CREAT
                            | SPIFFS_EXCL
                            | SPIFFS_APPEND, 0777);
                assert(fd >= 0 || POWERLOSS);
                if (fd < 0) {
                    // uh oh, found an error? try to remount with check
                    LFS3_DEBUG("spiffs: open error: %d, remounting...", fd);
                    needs_check = true;
                    BENCH_ABORT("write");
                    BENCH_ABORT("write_");
                    SPIFFS_unmount(&spiffs);
                    goto remount_and_check;
                }
            }
            #elif defined(YAFFS2)
            struct yaffs_stat stat;
            yaffs_fstat(fd, &stat) => 0;
            if (stat.st_size >= SIZE) {
                yaffs_close(fd) => 0;
                yaffs_rename("bench_log", "bench_log.1") => 0;
                fd = yaffs_open("bench_log",
                        O_WRONLY | O_CREAT | O_EXCL | O_APPEND, 0777);
                assert(fd >= 0);
            }
            #endif
            in_rotation = false;

            written += CHUNK;
            BENCH_STOP("write", written);
            if (mountwriting) {
                BENCH_STOP("write_", mounts);
                BENCH_STOP("mountwrite", mounts);
                mountwriting = false;

                // how long to run this loop?
                if (POWER_WAITFORMOUNT == 1
                        || (POWER_WAITFORMOUNT == 2
                            && stuck >= (uint64_t)POWER_STUCKTHRESH)) {
                    if (POWER_MINTIME || POWER_MAXTIME) {
                        bench_mount_start_time = BENCH_SIMTIME();
                        bench_mount_stop_time = bench_mount_start_time
                                + POWER_MINTIME
                                + ((0x100010001ULL * BENCH_PRNG(&prng))
                                    % (POWER_MAXTIME+1 - POWER_MINTIME));
                    }
                    if (POWER_MINPROGS || POWER_MAXPROGS) {
                        bench_mount_start_progs = 0;
                        bench_mount_stop_progs = bench_mount_start_progs
                                + POWER_MINPROGS
                                + (BENCH_PRNG(&prng)
                                    % (POWER_MAXPROGS+1 - POWER_MINPROGS));
                    }
                }
            }
        }
        // if we didn't need mkconsistent, report 0 so percentile
        // measurements make sense
        if (!mkconsistented) {
            BENCH_START("mkconsistent");
            BENCH_STOP("mkconsistent", mounts);
        }

        // close
        BENCH_START("closeunmount");
        BENCH_START("close");
        #if defined(LFS3)
        lfs3_file_close(&lfs3, &file) => 0;
        #elif defined(LFS2)
        lfs2_file_close(&lfs2, &file) => 0;
        #elif defined(SPIFFS)
        SPIFFS_close(&spiffs, fd) => 0;
        #elif defined(YAFFS2)
        yaffs_close(fd) => 0;
        #endif
        BENCH_STOP("close", mounts);

        // unmount
        BENCH_START("unmount");
        #if defined(LFS3)
        lfs3_unmount(&lfs3) => 0;
        #elif defined(LFS2)
        lfs2_unmount(&lfs2) => 0;
        #elif defined(SPIFFS)
        SPIFFS_unmount(&spiffs);
        #elif defined(YAFFS2)
        yaffs_unmount("/") => 0;
        yaffs_remove_device(&yaffs2);
        #endif
        BENCH_STOP("unmount", mounts);
        BENCH_STOP("closeunmount", mounts);
    }

    // disable additional powerlosses
    bench_mount_reset();

    // report the number of interrupted log-rotations, note this may be
    // different from grms
    BENCH_RESULT("rotates", mounts, rotates);
    // report the number of grms
    #ifdef LFS3
    BENCH_RESULT("grms", mounts, grms);
    #endif

    // report the total stack/heap usage after the benchmark
    #ifdef BENCH_STACK
    BENCH_RESULT("stack", written, BENCH_STACK_WATERMARK());
    #endif
    #ifdef BENCH_HEAP
    BENCH_RESULT("heap", written, BENCH_HEAP_WATERMARK());
    #endif

    // find the total disk usage after the benchmark
    #if defined(LFS3)
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    #elif defined(LFS2)
    lfs2_mount(&lfs2, CFG_LFS2) => 0;
    #elif defined(SPIFFS)
    SPIFFS_mount(&spiffs, (spiffs_config*)CFG_SPIFFS, work_buffer,
            fd_buffer, FD_SIZE,
            scache_buffer, SCACHE_SIZE,
            NULL) => 0;
    #elif defined(YAFFS2)
    // yaffs2 uses some global state we need to reset
    extern struct list_head yaffsfs_deviceList;
    INIT_LIST_HEAD(&yaffsfs_deviceList);
    extern int yaffsfs_handlesInitialised;
    yaffsfs_handlesInitialised = false;
    // yes, yaffs2 needs this to be zeroed
    yaffs2 = (struct yaffs_dev){
        .driver_context = CFG,
        .param = CFG_YAFFS2->param,
        .drv = CFG_YAFFS2->drv,
    };
    yaffs_add_device(&yaffs2);
    yaffs_mount("/") => 0;
    #endif
    struct bench_helpers_usage usage;
    #if defined(LFS3)
    bench_helpers_usage(CFG, &lfs3, &usage) => 0;
    #elif defined(LFS2)
    bench_helpers_usage(CFG, &lfs2, &usage) => 0;
    #elif defined(SPIFFS)
    bench_helpers_usage(CFG, &spiffs, &usage) => 0;
    #elif defined(YAFFS2)
    bench_helpers_usage(CFG, &yaffs2, &usage) => 0;
    #endif
    BENCH_RESULT("usage", written, usage.usage);
    BENCH_RESULT("mdir", written, usage.mdir);
    BENCH_RESULT("btree", written, usage.btree);
    BENCH_RESULT("data", written, usage.data);
    #if defined(LFS3)
    lfs3_unmount(&lfs3) => 0;
    #elif defined(LFS2)
    lfs2_unmount(&lfs2) => 0;
    #elif defined(SPIFFS)
    SPIFFS_unmount(&spiffs);
    #elif defined(YAFFS2)
    yaffs_unmount("/") => 0;
    yaffs_remove_device(&yaffs2);
    #endif

    // other cleanup?
    #if defined(LFS3)
    #elif defined(LFS2)
    #elif defined(SPIFFS)
    free(work_buffer);
    free(fd_buffer);
    free(scache_buffer);
    #elif defined(YAFFS2)
    #endif
'''

